# 后台端（admin）容器里的 nginx：静态资源 + 图片直出 + 转发 /api（后台不用 AI 导购，所以没有 /ai）
# 与商城端同一套写法，区别只有：不转发 /ai
server {
    listen 80;
    server_name _;

    # ── 图片直出 ──────────────────────────────────────────────────────────
    # 与宿主 /srv/petmall/upload 是同一个 bind mount（见 docker-compose.yml），
    # 后台的商品图预览就靠这一段 —— 以前它硬编码 http://localhost:8080/api 直连后端，
    # sftp 模式下后端不再接管 /upload，预览就 404 了，现在改由本容器发图。
    # 用 root 不用 alias：这台虚拟机的 nginx 上 alias + 嵌套 location 实测对 /upload/ 一律 404。
    root /srv/petmall;
    location /upload/ {
        autoindex off;
        expires 7d;
    }
    location ~* ^/upload/.*\.(php|jsp|asp|html|htm|js|svg)$ { deny all; }

    # ── 前端静态资源 ──────────────────────────────────────────────────────
    # Vue Router 是 history 模式，刷新子路由必须回落到 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── 业务接口 → 后端容器（不带结尾斜杠，保留 /api 前缀）─────────────────
    location /api/ {
        proxy_pass http://petmall-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;   # 商家传商品图走这里；nginx 默认 1m 会 413
    }
}
