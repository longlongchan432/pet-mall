# 商城端（mall）容器里的 nginx：自己发静态资源、自己发图片、转发 /api 与 /ai
server {
    listen 80;
    server_name _;

    # ── 图片直出 ──────────────────────────────────────────────────────────
    # 与宿主 /srv/petmall/upload 是同一个 bind mount（见 docker-compose.yml），
    # 所以浏览器直接从这里取图，后端完全不参与读图。
    # 用 root 不用 alias：这台虚拟机的 nginx 上 alias + 嵌套 location 实测对 /upload/ 一律 404。
    root /srv/petmall;
    location /upload/ {
        autoindex off;
        expires 7d;            # 顺带发 Cache-Control: max-age=604800
    }
    # 上传目录里只该有图片。svg/html/js 会被浏览器当代码执行，万一混入就是存储型 XSS，直接拒
    location ~* ^/upload/.*\.(php|jsp|asp|html|htm|js|svg)$ { deny all; }

    # ── 前端静态资源 ──────────────────────────────────────────────────────
    # Vue Router 是 history 模式：直接访问/刷新 /product/1 这类子路由时磁盘上没有该文件，
    # 必须回落到 index.html，否则按一次 F5 就是 404
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── 业务接口 → 后端容器 ───────────────────────────────────────────────
    # 不带结尾斜杠：/api/xxx 原样转过去，而后端的 context-path 正是 /api
    location /api/ {
        proxy_pass http://petmall-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;   # nginx 默认 1m，传图必 413；后端上限是单张 5MB / 请求 10MB
    }

    # ── AI 导购 → AI 容器 ─────────────────────────────────────────────────
    # 带结尾斜杠：把 /ai 前缀剥掉，AI 服务只认 /api/chat/stream、/health 这类路径
    # SSE 流式必须关缓冲，否则浏览器会「卡很久然后一次性吐出来」
    location /ai/ {
        proxy_pass http://petmall-ai:8082/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
